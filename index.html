<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08090C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Дневник">
<meta name="robots" content="noindex">
<title>Дневник восстановления</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap">
<style>
html{color-scheme:light}
body{margin:0}
[hidden]{display:none!important}

/* Layout: одна колонка телефона. Сверху «кольца дня», ниже крупные карточки-блоки. Интерфейс монохромный, цвет только у данных: сон, активность, слабость. */
/* Палитры: один цвет оформления (--a1) и его оттенки. Нейтральные фон и карточки слегка подкрашены им. */
:root{
  --a1-l:#4E7A66; --a1-d:#9FCBB4;
  --a1:var(--a1-l); --base-bg:#F3F4F6; --base-card:#FFFFFF;
  --bg:color-mix(in srgb,var(--a1) 6%,var(--base-bg)); --card:color-mix(in srgb,var(--a1) 2%,var(--base-card)); --card-2:color-mix(in srgb,var(--a1) 7%,var(--base-bg));
  --ink:#101317; --muted:#6A707B; --line:color-mix(in srgb,var(--a1) 10%,#E3E5E9); --on-a1:#FFFFFF; --on-ink:#FFFFFF;
  --a2:color-mix(in srgb,var(--a1) 62%,var(--card)); --a3:color-mix(in srgb,var(--a1) 40%,var(--card)); --a-soft:color-mix(in srgb,var(--a1) 14%,var(--card));
  --sleep:var(--a1); --move:var(--a2); --ex:var(--a3); --weak:var(--a1); --rec:var(--a2); --bad:#B9524E;
  --glow:color-mix(in srgb,var(--a1) 22%,transparent);
  --wt:var(--a3); --exb:#22A866; --goal:#1FA463;
  --f-d:"Unbounded","Onest",system-ui,sans-serif; --f-b:"Onest",-apple-system,system-ui,"Segoe UI",sans-serif;
}
:root[data-accent="multi"]{--wt:#1597B0; --exb:#22A866; --a1-l:#30343B; --a1-d:#D9DDE4; --sleep:#5B5BE6; --move:#F2613F; --ex:#22A866; --weak:#E8930C; --rec:#1597B0}
:root[data-accent="sky"]{--a1-l:#2F6F95; --a1-d:#8CC6E8}
:root[data-accent="graphite"]{--a1-l:#30343B; --a1-d:#D9DDE4}
@media (prefers-color-scheme: dark){:root[data-accent="multi"]:not([data-theme="light"]){--wt:#3CC8E0; --exb:#3DDC8A; --sleep:#8B8BFF; --move:#FF7A57; --ex:#3DDC8A; --weak:#FFB23E; --rec:#3CC8E0}}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --exb:#3DDC8A; --goal:#34D399; --a1:var(--a1-d); --base-bg:#08090C; --base-card:#131519; --ink:#F1F3F5; --muted:#8E949E; --line:color-mix(in srgb,var(--a1) 10%,#24272E);
  --on-a1:#0A0B0E; --on-ink:#08090C; --bad:#E0817C; --bg:color-mix(in srgb,var(--a1) 4%,var(--base-bg)); --card:color-mix(in srgb,var(--a1) 4%,var(--base-card)); --card-2:color-mix(in srgb,var(--a1) 8%,#1A1D22); color-scheme:dark}}
:root[data-theme="dark"][data-accent="multi"]{--wt:#3CC8E0; --exb:#3DDC8A; --sleep:#8B8BFF; --move:#FF7A57; --ex:#3DDC8A; --weak:#FFB23E; --rec:#3CC8E0}
:root[data-theme="dark"]{
  --exb:#3DDC8A; --goal:#34D399; --a1:var(--a1-d); --base-bg:#08090C; --base-card:#131519; --ink:#F1F3F5; --muted:#8E949E; --line:color-mix(in srgb,var(--a1) 10%,#24272E);
  --on-a1:#0A0B0E; --on-ink:#08090C; --bad:#E0817C; --bg:color-mix(in srgb,var(--a1) 4%,var(--base-bg)); --card:color-mix(in srgb,var(--a1) 4%,var(--base-card)); --card-2:color-mix(in srgb,var(--a1) 8%,#1A1D22); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-b);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app{max-width:440px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:6px calc(104px + env(safe-area-inset-bottom,0px))}
.num{font-variant-numeric:tabular-nums}
.preview{font-size:12.5px;color:var(--muted);border:1px dashed var(--line);border-radius:14px;padding:8px 12px;margin:4px 0 12px}
.preview b{color:var(--ink);font-weight:600}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border-radius:24px;padding:16px}
.ch{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.ch h2{margin:0;font-family:var(--f-d);font-size:16px;font-weight:600;letter-spacing:-.2px}
.ch .aside{font-size:12.5px;color:var(--muted)}
.sub{font-size:13px;color:var(--muted)}
.lbl{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}

/* hero */
.hero{position:relative;overflow:hidden;background:var(--card);border-radius:28px;padding:18px 18px 16px}
.hero::after{content:"";position:absolute;inset:-40% -30% auto auto;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,var(--glow),transparent 70%);pointer-events:none}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.day{font-family:var(--f-d);font-weight:700;font-size:44px;line-height:.95;letter-spacing:-1.5px}
.day small{display:block;font-family:var(--f-b);font-size:15px;font-weight:500;letter-spacing:0;color:var(--muted);margin-top:8px}
.streak{font-size:12.5px;font-weight:600;background:var(--card-2);padding:6px 10px;border-radius:99px;white-space:nowrap}
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.ring{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.ring svg{width:84px;height:84px}
.ring .v{font-weight:700;font-size:15px}
.ring .l{font-size:12px;color:var(--muted);line-height:1.2}

/* metrics grid */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.m{background:var(--card-2);border-radius:16px;padding:12px}
.m .k{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.m .k i{width:8px;height:8px;border-radius:50%;display:inline-block}
.m .v{font-size:20px;font-weight:700;margin-top:4px;letter-spacing:-.3px}
.m .v span{font-size:13px;font-weight:500;color:var(--muted);margin-left:2px}
.m .d{font-size:12px;color:var(--muted);margin-top:2px}
.m.wide{grid-column:1/-1}
.stages{display:flex;height:8px;border-radius:4px;overflow:hidden;margin-top:8px;gap:2px}
.stages span{display:block;height:100%}
.slegend{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px;font-size:11.5px;color:var(--muted)}
.slegend i{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:4px}

/* weakness scale */
.scale-row{display:flex;flex-direction:column;gap:8px}
.scale-row + .scale-row{margin-top:14px}
.scale-head{display:flex;justify-content:space-between;align-items:baseline}
.scale-head b{font-weight:600}
.scale-head .val{font-size:13px;color:var(--muted)}
.scale{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
.scale button{font:inherit;font-size:14px;font-weight:600;aspect-ratio:1/1.15;max-width:100%;border:0;border-radius:10px;background:var(--card-2);color:var(--muted);cursor:pointer;padding:0}
.scale button[aria-pressed="true"]{background:var(--weak);color:var(--on-a1);transform:scale(1.08)}
.scale-ends{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}

/* chips & seg */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:14.5px;padding:8px 13px;border-radius:99px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--a-soft);border-color:color-mix(in srgb,var(--a1) 55%,transparent);color:var(--ink);font-weight:500}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--card-2);border-radius:14px;padding:4px;gap:4px}
.seg button{font:inherit;font-size:14.5px;border:0;background:transparent;color:var(--muted);padding:9px 4px;border-radius:10px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.mood{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.mood button{font:inherit;border:0;background:var(--card-2);color:var(--muted);border-radius:14px;padding:10px 2px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px}
.mood svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.mood button[aria-pressed="true"]{background:var(--a1);color:var(--on-a1)}

/* rows */
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0}
.row + .row{border-top:1px solid var(--line)}
.row .t{font-weight:500}
.row .s{font-size:12.5px;color:var(--muted)}
.row > div:first-child{min-width:0}
.tog{width:50px;height:30px;border-radius:99px;border:0;background:var(--line);position:relative;cursor:pointer;flex:none;padding:0}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.tog[aria-pressed="true"]{background:var(--a1)}
.tog[aria-pressed="true"]::after{left:23px}
.check{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;cursor:pointer;background:transparent;flex:none;padding:0}
.check[aria-pressed="true"]{background:var(--a1);border-color:var(--a1)}
.check svg{width:15px;height:15px;stroke:var(--on-a1);opacity:0}
.check[aria-pressed="true"] svg{opacity:1}
.step{display:flex;align-items:center;gap:4px;flex:none}
.step button{width:34px;height:34px;border-radius:50%;border:0;background:var(--card-2);color:var(--ink);font-size:19px;cursor:pointer;padding:0}
.step output{min-width:56px;text-align:center;font-weight:700;font-size:16px}
.rec{color:var(--a1)}
.badge{font-size:11px;font-weight:700;color:var(--a1);background:var(--a-soft);padding:2px 7px;border-radius:99px;margin-left:6px;vertical-align:1px}
.wk{display:flex;gap:12px;align-items:center;background:var(--card-2);border-radius:16px;padding:12px}
.wk + .wk{margin-top:8px}
.wk .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.wk .ic svg{width:22px;height:22px;stroke:var(--a1);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.wk .b{flex:1;min-width:0}
.wk .t{font-weight:600}
.wk .s{font-size:12.5px;color:var(--muted)}
.wk .x{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:12px;color:var(--muted)}
.add{font:inherit;font-size:14.5px;font-weight:600;color:var(--ink);background:transparent;border:1px dashed var(--line);border-radius:14px;padding:11px;width:100%;margin-top:10px;cursor:pointer}
.form{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.form input{grid-column:span 1}
.form .full{grid-column:1/-1}
textarea,input[type=text]{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--card-2);border:1px solid transparent;border-radius:14px;padding:11px 12px}
textarea:focus,input[type=text]:focus{outline:none;border-color:var(--ink)}
textarea{min-height:104px;resize:vertical}
.btn{font:inherit;font-weight:600;font-size:16px;border:0;border-radius:18px;padding:16px;background:var(--a1);color:var(--on-a1);cursor:pointer;width:100%}
.btn.sm{padding:11px;font-size:14.5px;border-radius:14px}
button:focus-visible{outline:2px solid var(--a1);outline-offset:2px}
.divider{height:1px;background:var(--line);margin:14px 0}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
.tabs-in{pointer-events:auto;max-width:420px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:26px;padding:6px;box-shadow:0 8px 30px rgba(0,0,0,.12)}
.tab{border:0;background:transparent;font:inherit;font-size:10.5px;color:var(--muted);padding:7px 2px;border-radius:20px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.tab svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--a1);background:var(--a-soft);font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--on-ink);padding:11px 16px;border-radius:14px;font-size:14px;z-index:30;white-space:nowrap}

/* other screens */
.h1{font-family:var(--f-d);font-weight:700;font-size:30px;letter-spacing:-.8px;line-height:1.05;margin:10px 0 14px}
.pill{font-size:12px;font-weight:600;padding:5px 10px;border-radius:99px;background:var(--card);white-space:nowrap}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}
.entry .eh{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.entry .eh b{font-family:var(--f-d);font-size:15px;font-weight:600}
.entry .eh span{color:var(--muted);font-size:13px}
.entry p{margin:8px 0 10px;font-size:14.5px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;padding:4px 9px;border-radius:99px;background:var(--card-2);color:var(--muted)}
.tag.w{color:var(--a1);background:var(--a-soft);font-weight:600}
.month{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:6px 4px -2px}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--muted);font-family:var(--f-b);font-size:10px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.ins .big{font-family:var(--f-d);font-size:18px;font-weight:600;line-height:1.25;margin:0 0 10px;text-wrap:balance;letter-spacing:-.2px}
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:120px 1fr 30px;align-items:center;gap:8px;font-size:13px}
.bar .track{height:10px;background:var(--card-2);border-radius:5px;overflow:hidden}
.bar .fill{height:100%;border-radius:5px;background:var(--a1)}
.bar .fill.c{background:var(--muted);opacity:.45}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:6px 4px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 4px;border-bottom:1px solid var(--line)}
.scroll{overflow-x:auto}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{border:0;background:transparent;font:inherit;font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;padding:0}
.sw i{width:34px;height:34px;border-radius:50%;display:block;background-size:cover;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.sw[aria-pressed="true"] i{outline:2px solid var(--ink);outline-offset:3px}
.sw[aria-pressed="true"]{color:var(--ink);font-weight:600}
.kg{font:inherit;font-size:12px;font-weight:600;border:0;border-radius:99px;padding:3px 9px;background:var(--a-soft);color:var(--a1);cursor:pointer;margin-left:6px;vertical-align:1px}
.collapse{font:inherit;width:100%;border:0;background:transparent;color:var(--ink);display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0;cursor:pointer;text-align:left}
.collapse .chev{transition:transform .15s;color:var(--muted)}
.collapse[aria-expanded="true"] .chev{transform:rotate(90deg)}
.peek{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px;color:var(--muted);margin-top:8px}
.peek b{color:var(--ink);font-weight:600}
@media (prefers-reduced-motion:no-preference){.screen{animation:in .2s ease-out}@keyframes in{from{opacity:.5;transform:translateY(6px)}to{opacity:1;transform:none}}.scale button{transition:transform .12s}}
.app{padding-top:calc(env(safe-area-inset-top,0px) + 8px)}
.h2{margin:0;font-family:var(--f-d);font-size:16px;font-weight:600;letter-spacing:-.2px}
.datenav{display:flex;align-items:center;justify-content:space-between;margin:-4px -6px 10px;position:relative;z-index:1}
.datenav span{font-size:13px;font-weight:600;color:var(--muted);text-transform:lowercase}
.datenav button{width:36px;height:32px;border:0;border-radius:10px;background:var(--card-2);color:var(--ink);font-size:20px;cursor:pointer;padding:0}
.datenav button:disabled{opacity:.3}
button.streak{border:0;color:var(--ink);font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;position:relative;z-index:1}
.chip.add-chip{border-style:dashed;color:var(--muted)}
.chip.sm{font-size:13px;padding:6px 10px}
.inline{display:flex;gap:8px;align-items:center;margin-top:10px}
.inline input{flex:1;min-width:0}
.del{border:0;background:transparent;color:var(--muted);font-size:22px;line-height:1;cursor:pointer;padding:2px 6px}
.rowbtn{width:100%;border:0;background:transparent;font:inherit;color:inherit;text-align:left;cursor:pointer}
label.rowbtn{cursor:pointer}
.empty{color:var(--muted);font-size:14.5px}
.empty .big{font-family:var(--f-d);font-size:18px;font-weight:600;color:var(--ink);line-height:1.25}
.backbtn{border:0;background:transparent;font:inherit;font-size:15px;color:var(--a1);padding:6px 0;cursor:pointer;margin-top:4px}
.code{display:block;font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--card-2);padding:10px;border-radius:10px;word-break:break-all;user-select:all}
.btn.ghost{background:var(--card-2);color:var(--ink)}
.btn.danger{background:var(--bad);color:#fff}
button.entry{display:block;width:100%;text-align:left;border:0;font:inherit;color:inherit;cursor:pointer}
input[type=search],input[type=password],input[type=date],.hin{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--card-2);border:1px solid transparent;border-radius:14px;padding:11px 12px}
.hin{background:var(--card);padding:6px 8px;margin:4px 0 2px;font-weight:700;font-size:18px;border-radius:10px}
label.m{display:block}
.wk .ic{background:var(--a-soft)}
.banner{border:1.5px solid color-mix(in srgb,var(--a1) 45%,transparent)}

.medlist{display:flex;flex-direction:column;gap:8px}
.med{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:16px;background:var(--card-2)}
.med .t{font-weight:600}.med .s{font-size:12.5px;color:var(--muted)}
.med.due{background:color-mix(in srgb,var(--bad) 14%,var(--card));box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--bad) 60%,transparent)}
.med.due .s{color:var(--bad);font-weight:600}
.med.taken .t{color:var(--muted)}
.due-card{box-shadow:0 0 0 1.5px color-mix(in srgb,var(--bad) 45%,transparent)}
.mbtns{display:flex;gap:6px;flex:none}
.mbtn{font:inherit;font-size:13.5px;font-weight:600;border:0;border-radius:12px;padding:9px 12px;background:var(--a1);color:var(--on-a1);cursor:pointer}
.mbtn.ghost{background:var(--card);color:var(--ink)}
.med.due .mbtn:not(.ghost){background:var(--bad);color:#fff}
.mstate{font:inherit;font-size:13px;font-weight:600;border:0;border-radius:99px;padding:7px 11px;background:var(--a-soft);color:var(--a1);cursor:pointer;flex:none}
.mstate.skipped{background:var(--card);color:var(--muted)}
.medit{padding:8px 0;border-bottom:1px solid var(--line)}
input[type=time]{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--card-2);border:1px solid transparent;border-radius:14px;padding:10px 12px}
.add.pulse{border-style:solid;border-color:var(--a1);color:var(--a1);animation:pl 1.2s ease-in-out infinite}
@keyframes pl{50%{background:var(--a-soft)}}

html,body,button,label,.chip{touch-action:manipulation}
.rings{grid-template-columns:repeat(3,1fr) 34px!important;align-items:start}
.sober{display:flex;gap:8px;margin-top:12px;position:relative;z-index:1}
.sober div{display:flex;align-items:baseline;gap:6px;background:var(--card-2);border-radius:99px;padding:6px 12px}
.sober b{font-family:var(--f-d);font-size:16px;font-weight:700;line-height:1}
.sober span{font-size:12px;color:var(--muted);white-space:nowrap}
.thermo{display:flex;flex-direction:column;align-items:center;gap:4px}
.thermo .tt{width:14px;height:84px;border-radius:7px;background:color-mix(in srgb,var(--exb) 20%,transparent);position:relative;overflow:hidden}
.thermo .tt i{position:absolute;left:0;right:0;bottom:0;background:var(--exb);border-radius:7px}
.thermo b{font-size:14px;font-weight:700}
.thermo span{font-size:11px;color:var(--muted);margin-top:-4px}
.linkbtn{font:inherit;font-size:13.5px;color:var(--a1);background:transparent;border:0;padding:10px 0 0;cursor:pointer}
.linkbtn.danger{color:var(--bad);padding:0 4px}
.medact{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}
.mbtn.danger{background:var(--bad);color:#fff}
.m .d.warn{color:var(--bad);font-weight:600}
.chip.dim{opacity:.55}
input[type=time].medtime{display:inline-block;vertical-align:baseline;font:inherit;font-size:13px;font-weight:600;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:2px 6px;width:auto;min-width:0}
.med.edit{display:block;box-shadow:inset 0 0 0 1.5px var(--a1)}
.medconf{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;font-size:14px;font-weight:600}
.medconf input[type=time]{width:auto;font-size:18px;font-weight:700;padding:8px 12px}
.hint2{font-size:11px;color:var(--muted);margin-top:2px}
.mtag{font-size:10.5px;font-weight:600;color:var(--a1);background:var(--a-soft);padding:1px 6px;border-radius:99px;margin-left:4px}
.wk .x{flex-direction:row;align-items:center;gap:6px}
.form .seg,.form .chips{grid-column:1/-1}
#lock{position:fixed;inset:0;background:var(--bg);z-index:50;display:grid;place-items:center;padding:24px}
.lock-in{width:100%;max-width:300px}
.dots{display:flex;justify-content:center;gap:16px;margin:18px 0 28px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink)}
.dots i.on{background:var(--ink)}
.dots.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.pad button{aspect-ratio:1;border-radius:50%;border:0;background:var(--card);color:var(--ink);font:inherit;font-size:26px;cursor:pointer}

/* неделя в шапке */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:14px;position:relative;z-index:1}
.week button{border:0;background:transparent;font:inherit;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 8px;border-radius:15px;cursor:pointer;transition:background .15s}
.week span{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.week b{font-size:16px;font-weight:600;color:var(--ink);line-height:1}
.week i{width:5px;height:5px;border-radius:50%;background:color-mix(in srgb,var(--muted) 30%,transparent)}
.week i.on{background:var(--a1)}
.week button.now b{color:var(--a1)}
.week button[aria-pressed="true"]{background:var(--ink)}
.week button[aria-pressed="true"] b,.week button[aria-pressed="true"] span{color:var(--on-ink)}
.week button[aria-pressed="true"] i.on{background:var(--on-ink)}
.week button:disabled{opacity:.3}
.datenav .totoday{width:auto;height:30px;padding:0 12px;border-radius:99px;font-size:13px;font-weight:600;background:var(--a-soft);color:var(--a1)}
[data-accent="multi"] .week i.on{background:var(--sleep)}
/* шапка */
.hero{border-radius:30px;padding:18px 18px 18px}
.rings{margin-top:14px}
.sober div{background:color-mix(in srgb,var(--card-2) 80%,transparent)}
/* стеклянная панель вкладок (как в iOS 26) */
.tabs-in{background:color-mix(in srgb,var(--card) 58%,transparent);backdrop-filter:blur(24px) saturate(1.8);-webkit-backdrop-filter:blur(24px) saturate(1.8);border:1px solid color-mix(in srgb,#fff 55%,transparent);border-radius:30px;box-shadow:0 12px 34px rgba(0,0,0,.14),inset 0 1px 0 rgba(255,255,255,.55)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tabs-in{border-color:rgba(255,255,255,.09);box-shadow:0 12px 34px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.07)}}
:root[data-theme="dark"] .tabs-in{border-color:rgba(255,255,255,.09);box-shadow:0 12px 34px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.07)}
.tab{border-radius:24px;padding:8px 2px}
.tab[aria-selected="true"]{background:color-mix(in srgb,var(--a1) 13%,transparent)}
/* кнопка «Здоровья» */
.btn.hk{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;border-radius:16px;padding:14px}
.btn.hk .hi{width:19px;height:19px;fill:currentColor;flex:none}
.btn.hk.pulse{animation:hp 1.3s ease-in-out infinite}
@keyframes hp{50%{box-shadow:0 0 0 7px var(--a-soft)}}
@media (prefers-reduced-motion:reduce){.btn.hk.pulse{animation:none}}
.hkrow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px}
.hkrow .linkbtn{padding:6px 0;flex:none}
.hkrow .sub{font-size:12.5px}
/* метки */
.chip{transition:background .12s,border-color .12s}
.chip[aria-pressed="true"]::before{content:"✓";font-weight:700;margin-right:5px}
.m{border-radius:18px}
.btn{border-radius:18px}
.add{border-radius:16px}
/* подходы упражнений */
.addset{display:inline-block;font:inherit;font-size:12.5px;font-weight:600;color:var(--muted);background:var(--card-2);border:0;border-radius:99px;padding:4px 10px;margin-top:7px;cursor:pointer}
[data-accent="multi"] .card[data-sec] .addset{color:var(--sc);background:color-mix(in srgb,var(--sc) 14%,var(--card))}
.exrow.multi{padding-bottom:8px}
.sets{display:flex;flex-direction:column;gap:6px;padding:0 0 12px}
.sets + .row{border-top:1px solid var(--line)}
.setrow{display:flex;align-items:center;gap:6px;background:var(--card-2);border-radius:16px;padding:5px 4px 5px 12px}
.setrow .sn{font-size:12.5px;font-weight:700;color:var(--muted);min-width:16px}
.setrow .sn::after{content:" подход";font-weight:500}
.setrow .step{margin-left:auto}
.setrow .step button{background:var(--card)}
.setrow .del{font-size:20px;padding:2px 8px}
/* списки в «Ещё» */
.lrow{gap:8px}
.lrow .lname{flex:1;min-width:0;border:0;background:transparent;font:inherit;color:inherit;text-align:left;padding:2px 0;cursor:pointer;display:flex;flex-direction:column;gap:1px}
.lrow .lname .t::after{content:"  ✎";color:var(--muted);font-size:13px;font-weight:400}
.lrow input{flex:1;min-width:0}
.lact{display:flex;gap:5px;align-items:center;flex:none}
.mv{width:36px;height:36px;border-radius:12px;border:0;background:var(--card-2);color:var(--ink);font:inherit;font-size:16px;font-weight:600;cursor:pointer;padding:0}
.mv:disabled{opacity:.28}
.exm + .exm{border-top:1px solid var(--line)}
.exmb{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 0 11px;flex-wrap:wrap}
.exmb .stepset{margin:0}
.exmb .medact{gap:10px}

/* ===== 3.3 · выше контраст ===== */
:root{--ink:#0B0D10;--muted:#3F444D;--base-bg:#E2E5EA;--line:color-mix(in srgb,var(--a1) 14%,#C3C8D0);--card-2:color-mix(in srgb,var(--a1) 9%,#E3E6EB);--goal:#127F48}
:root[data-accent="multi"]{--a1-l:#4040CF;--sleep:#4040CF;--move:#D2421B;--ex:#127F48;--weak:#A85F00;--rec:#08728A;--wt:#08728A;--exb:#127F48;
  --c-watch:#08728A;--c-weak:#A85F00;--c-mood:#B8306F;--c-train:#127F48;--c-meds:#C02E33;--c-day:#5A36DB;--c-stool:#7E5226;--c-note:#4040CF;--c-sick:#C02E33;--c-waist:#D2421B;--c-good:#127F48;--c-mid:#A85F00;--c-bad:#C02E33}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ink:#FFFFFF;--muted:#C2C7CF;--base-bg:#030405;--base-card:#1A1D23;--line:color-mix(in srgb,var(--a1) 14%,#3C414B);--card-2:color-mix(in srgb,var(--a1) 10%,#262A32);--goal:#3DDC8A}}
:root[data-theme="dark"]{--ink:#FFFFFF;--muted:#C2C7CF;--base-bg:#030405;--base-card:#1A1D23;--line:color-mix(in srgb,var(--a1) 14%,#3C414B);--card-2:color-mix(in srgb,var(--a1) 10%,#262A32);--goal:#3DDC8A}
.card,.hero{border:1px solid var(--line)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .card,:root:not([data-theme="light"]) .hero{border-color:var(--line)}}
:root[data-theme="dark"] .card,:root[data-theme="dark"] .hero{border-color:var(--line)}
[data-accent="multi"] .card[data-sec]{background:linear-gradient(180deg,color-mix(in srgb,var(--sc) 6%,var(--card)),var(--card) 55%)}
.chip{border-width:1.5px}
.ch .aside,.sub,.s,.tab,.ring .l{color:var(--muted)}
.tab[aria-selected="true"]{color:var(--a1)}
</style>

<script>
'use strict';
/* ===== Дневник восстановления · данные хранятся только на этом устройстве (IndexedDB) ===== */
const APP_VERSION = '3.5';
const MON=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MONN=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const WD=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'], WDS=['вс','пн','вт','ср','чт','пт','сб'];
const DAY=864e5;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dec=v=>String(v).replace('.',',');
const nf=n=>Math.round(n).toLocaleString('ru-RU');
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const todayISO=()=>iso(new Date());
const addDays=(s,n)=>iso(new Date(pd(s).getTime()+n*DAY+12*36e5));
const daysBetween=(a,b)=>Math.round((pd(b)-pd(a))/DAY);
const fmtSleep=h=>{const m=Math.round(h*60);return `${Math.floor(m/60)} ч ${String(m%60).padStart(2,'0')} мин`};
const fmtMin=m=>m==null?'—':m>=60?`${Math.floor(m/60)} ч ${String(m%60).padStart(2,'0')} мин`:`${m} мин`;
const fmtHM=h=>{const m=Math.round(h*60);return `${Math.floor(m/60)}:${String(m%60).padStart(2,'0')}`};
const fmtSec=s=>s>=60?`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`:`${s} с`;
const parseNum=v=>{if(v==null||v==='')return null;const n=parseFloat(String(v).replace(',','.').replace(/[^\d.\-]/g,''));return isFinite(n)?n:null};
const parseSleep=v=>{if(v==null||v==='')return null;const s=String(v).trim();let m=s.match(/^(\d+)\s*[:ч.]\s*(\d{1,2})/);if(m)return +m[1]+ +m[2]/60;return parseNum(s)};
const plural=(n,a,b,c)=>{const m=n%10,h=n%100;return m===1&&h!==11?a:m>=2&&m<=4&&(h<10||h>=20)?b:c};
const avg=a=>a.length?a.reduce((s,v)=>s+v,0)/a.length:null;
const uid=()=>Math.random().toString(36).slice(2,9);

/* ---------- storage ---------- */
const DB={db:null,
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('dnevnik',1);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('entries'))d.createObjectStore('entries',{keyPath:'date'});if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv')};r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error)})},
  req(r){return new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  st(n,m){return this.db.transaction(n,m).objectStore(n)},
  all(){return this.req(this.st('entries','readonly').getAll())},
  put(e){return this.req(this.st('entries','readwrite').put(e))},
  del(d){return this.req(this.st('entries','readwrite').delete(d))},
  clear(){return Promise.all([this.req(this.st('entries','readwrite').clear()),this.req(this.st('kv','readwrite').clear())])},
  get(k){return this.req(this.st('kv','readonly').get(k))},
  set(k,v){return this.req(this.st('kv','readwrite').put(v,k))},
};
const DEFAULTS={
  start:'2026-06-09', accent:'graphite',
  meds:[{id:'vitd',n:'Витамин D (АкваДетрим)',dose:'2000 МЕ',time:'08:00',active:true},{id:'mg',n:'Магний бисглицинат',dose:'200 мг',time:'21:00',active:true}],
  exercises:[
    {id:'plank',n:'Планка',u:'s',step:5,active:true},{id:'hang',n:'Вис на турнике',u:'s',step:5,active:true},
    {id:'squat',n:'Приседания',u:'n',step:5,active:true},{id:'push',n:'Отжимания',u:'n',step:1,active:true},
    {id:'pushk',n:'Отжимания с колен',u:'n',step:1,active:false,deleted:true},
    {id:'kb_swing',n:'Гиря, мах',u:'n',step:5,kg:6,active:true},{id:'kb_lift',n:'Гиря, подъём на руку',u:'n',step:5,kg:6,active:true},
    {id:'abs',n:'Пресс',u:'n',step:5,active:false}],
  causes:['Руль','Работа руками','Гиря, турник','Гребля','Долгая ходьба','Бег','Недосып','Холод','Простуда','Болезнь','Не знаю'],
  dayTypes:['Рабочий день','Выходной','Командировка','Дорога','Природа, поход','Рыбалка','Праздник','Баня'],
  emoWhy:['Работа','Семья','Дорога','Деньги','Здоровье'],
  symptoms:['Насморк','Горло','Кашель','Ломота','Головная боль','Слабость во всём теле'],
  sober:{alc:'2025-12-28',smoke:'2026-01-30'},
  goals:{sleep:7.5,steps:10000,exmin:30,weight:72,wStart:95.95,wtAlert:0.5},
  pin:null, lastExport:null,
};
let S=structuredClone(DEFAULTS);   // settings
const E=new Map();                  // date -> entry
const ui={tab:'today',date:todayISO(),watchOpen:false,editHealth:false,addEx:false,exU:'раз',addMed:false,addWk:false,wkT:'Бег',addCause:false,kgOpen:{},q:'',period:'month',chartEx:'plank',exportP:'all',confirmWipe:false,badge:0,manage:null};

async function saveSettings(){await DB.set('settings',S)}
const saveTimers={};
function saveEntry(e){e.updated=Date.now();E.set(e.date,e);clearTimeout(saveTimers[e.date]);saveTimers[e.date]=setTimeout(()=>DB.put(e).catch(err=>toast('Не удалось сохранить: '+err.message)),250)}
function entry(date){return E.get(date)||{date,health:{},ex:{},workouts:[],causes:[],dayType:[],sym:[],meds:{}}}
function norm(e){e.health??={};e.ex??={};e.workouts??=[];e.causes??=[];e.dayType??=[];e.sym??=[];e.meds??={};return e}
const hasContent=e=>e&&((e.bp||[]).length||e.emo!=null||Object.keys(e.meds||{}).length||e.note||e.arms!=null||e.legs!=null||Object.keys(e.health||{}).length||Object.keys(e.ex||{}).length||(e.workouts||[]).length||e.mood);
const dayN=date=>daysBetween(S.start,date)+1;

/* ---------- helpers ---------- */
function toast(t){const el=$('toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2400)}
const HEART='<svg class="hi" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>';

/* ---------- оценка сна (своя, по схеме Apple: длительность 50 + режим 30 + пробуждения 20) ---------- */
const SBAND=s=>s>=96?'отлично':s>=81?'хорошо':s>=71?'нормально':s>=41?'плохо':'очень плохо';
function sleepStats(e){const h=e?.health||{};if(!h.sl)return null;const hasSt=h.deep!=null||h.core!=null||h.rem!=null;if(!hasSt)return null;
  const sm=h.sl*60,aw=h.awin??h.awake??0;const eff=Math.round(sm/(sm+aw)*100);
  const dur=h.sl>=8.25?50:Math.max(0,50-3.12*Math.pow(8.25-h.sl,2));
  let reg=15,regTxt='нет времени отбоя';
  if(h.bedm!=null){const hist=[];for(let i=1;i<=14;i++){const x=E.get(addDays(e.date,-i))?.health;if(x?.bedm!=null)hist.push(x.bedm)}
    if(hist.length>=3){hist.sort((a,b)=>a-b);const med=hist[hist.length>>1];const diff=h.bedm-med,dev=diff>0?diff:Math.max(0,-diff-60);reg=dev<=30?30:dev>=150?0:30*(150-dev)/120;regTxt=Math.abs(diff)<=15?'лёг как обычно':`лёг ${diff>0?'позже':'раньше'} обычного на ${fmtMin(Math.abs(diff))}`}
    else{const dev=Math.max(0,Math.abs(h.bedm-300)-60);reg=dev>=120?0:30*(120-dev)/120;regTxt='сравню с обычным временем, когда накопится 3 ночи'}}
  const wk=h.wakes??0;const intr=Math.max(0,Math.min(20,20-Math.max(0,wk-3)));
  const score=Math.round(dur)+Math.round(reg)+Math.round(intr);return{eff,score,band:SBAND(score),dur:Math.round(dur),reg:Math.round(reg),intr:Math.round(intr),regTxt,aw,wk}}
function sleepBox(e){const x=sleepStats(e);if(!x)return '';const r=18,c=2*Math.PI*r,p=x.score/100;
  return `<div class="sbox"><div class="sscore"><svg viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="${r}" fill="none" stroke="var(--sleep)" stroke-opacity=".16" stroke-width="5"/><circle cx="22" cy="22" r="${r}" fill="none" stroke="var(--sleep)" stroke-width="5" stroke-linecap="round" stroke-dasharray="${(c*p).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 22 22)"/></svg><b class="num">${x.score}</b></div>
    <div class="sinfo"><div class="t">Оценка сна · ${x.band}</div><div class="s num">эффективность ${x.eff}% · пробуждений ${x.wk}${x.aw?' · '+fmtMin(x.aw):''}</div>
    <div class="sparts num"><span>длительность <b>${x.dur}</b>/50</span><span>режим <b>${x.reg}</b>/30</span><span>пробуждения <b>${x.intr}</b>/20</span></div><div class="s">${esc(x.regTxt)}</div></div></div>`}
function ring(val,max,color,label,sub,done){
  const r=34,c=2*Math.PI*r,p=val==null?0:Math.min(val/max,1),ok=done??(val!=null&&val>=max);const col=ok?'var(--goal)':color;
  return `<div class="ring${ok?' ok':''}"><svg viewBox="0 0 84 84" aria-hidden="true"><circle cx="42" cy="42" r="${r}" fill="none" stroke="${col}" stroke-opacity=".16" stroke-width="9"/>${p?`<circle cx="42" cy="42" r="${r}" fill="none" stroke="${col}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${(c*p).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 42 42)"/>`:''}${ok?`<path d="M33 43l6 6 12-13" fill="none" stroke="${col}" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>`:''}</svg><div class="v num">${label}</div><div class="l">${sub}</div></div>`;
}
function scale(e,key,title){
  const v=e[key];
  return `<div class="scale-row"><div class="scale-head"><b>${title}</b><span class="val num">${v==null?'не отмечено':`${v} · ${weakWord(v)}`}</span></div>
  <div class="scale" role="radiogroup" aria-label="${title}">${Array.from({length:11},(_,i)=>`<button role="radio" class="lv${i<=2?1:i<=5?2:3}" data-scale="${key}" data-v="${i}" aria-pressed="${i===v}" aria-checked="${i===v}">${i}</button>`).join('')}</div></div>`;
}

/* ---------- meds ---------- */
const nowHM=()=>{const d=new Date();return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`};
function medState(e,m,date){const r=e.meds?.[m.id];if(r?.st==='taken')return'taken';if(r?.st==='skipped')return'skipped';const t=todayISO();if(date===t)return m.time&&nowHM()>=m.time?'due':'pending';return date<t?'unmarked':'pending'}
function medLine(e,m){const r=e.meds?.[m.id];if(!r)return null;const nm=(r.n||m.n).split(' (')[0];return r.st==='taken'?`${nm} ${r.dose||m.dose||''} ✓ ${r.at||''}`.replace(/\s+/g,' ').trim():r.st==='skipped'?`${nm} — пропущено`:null}
/* ---------- stats ---------- */
function streak(){let d=todayISO();if(!hasContent(E.get(d)))d=addDays(d,-1);let n=0;while(hasContent(E.get(d))){n++;d=addDays(d,-1)}return n}
function exHistory(id,before,kg){
  let last=null,lastDate=null,best=0;
  for(const [d,e] of E){const x=e.ex?.[id];if(!x||!x.v||d===before)continue;
    if(kg==null||x.kg==null||x.kg===kg)best=Math.max(best,x.v);
    if(d<before&&(!lastDate||d>lastDate)){lastDate=d;last=x}}
  return{last,best};
}
function lastWeight(d){for(let i=0;i<=14;i++){const x=E.get(addDays(d,-i));if(x?.health?.w)return{v:x.health.w,d:x.date}}return null}
function wtInfo(d){const h=E.get(d)?.health||{};if(h.wt==null)return h.wtemp!=null?{dev:h.wtemp}:null;const prev=[];for(let i=1;i<=30&&prev.length<14;i++){const x=E.get(addDays(d,-i))?.health?.wt;if(x!=null)prev.push(x)}return{abs:h.wt,dev:prev.length>=3?h.wt-avg(prev):null,n:prev.length}}
function prevWaist(before){let best=null;for(const[d,e]of E)if(e.waist&&d<before&&(!best||d>best.d))best={d,v:e.waist};return best}
function weightWeekDelta(date){const e=E.get(date);if(!e?.health?.w)return null;let ref=null;for(let i=6;i<=9;i++){const p=E.get(addDays(date,-i));if(p?.health?.w){ref=p.health.w;break}}return ref==null?null:e.health.w-ref}

      <div class="thermo${h.exmin!=null&&h.exmin>=S.goals.exmin?' ok':''}" aria-label="Упражнения ${h.exmin??0} из ${S.goals.exmin} минут"><div class="tt"><i style="height:${Math.round(exP*100)}%"></i>${h.exmin!=null&&h.exmin>=S.goals.exmin?'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12.5l4 4 8-9"/></svg>':''}</div><b class="num">${h.exmin??'—'}</b><span>мин<br>цель ${S.goals.exmin}</span></div></div>

        ${h.slNote?`<div class="d">${esc(h.slNote)}</div>`:''}${sleepBox(e)}</div>`}

  const waist=`<section class="card" data-sec="waist"><div class="row" style="padding:0"><div>${h2('Обхват живота')}<div class="s">раз в неделю${pw?` · прошлый ${dec(pw.v)} см, ${pd(pw.d).getDate()} ${MON[pd(pw.d).getMonth()]}`:''}</div></div><input type="text" inputmode="decimal" id="waist" placeholder="см" value="${esc(e.waist??'')}" style="width:86px;text-align:center"></div></section>`;

function tagsFor(e){const h=e.health||{},t=[];
  if(e.arms!=null||e.legs!=null)t.push(`<span class="tag w num">руки ${e.arms??'—'} · ноги ${e.legs??'—'}</span>`);
  if(e.sick)t.push('<span class="tag" style="color:var(--bad)">болел</span>');
  if(e.bp?.length)t.push(`<span class="tag num">давление ${e.bp.map(r=>r.sys+'/'+r.dia).join(', ')}</span>`);
  if(e.emo>=1)t.push(`<span class="tag">эмоции: ${EMO[e.emo]}${e.held?', сдержался':''}</span>`);
  if(h.sl){const x=sleepStats(e);t.push(`<span class="tag num">сон ${fmtSleep(h.sl)}${x?' · оценка '+x.score+' · '+x.eff+'%':h.sq!=null?' · '+h.sq:''}</span>`)}
  if(h.w)t.push(`<span class="tag num">${dec(h.w)} кг</span>`);
  if(h.steps)t.push(`<span class="tag num">${nf(h.steps)} шагов</span>`);
  for(const[id,x]of Object.entries(e.ex||{}))if(x.v){const d=exById(id);t.push(`<span class="tag num">${esc(d.n.toLowerCase())} ${fmtSets(d,x)}${x.kg?' · '+dec(x.kg)+' кг':''}</span>`)}
  for(const w of e.workouts||[])t.push(`<span class="tag">${esc((w.t||'').toLowerCase())}${w.dist?' '+esc(w.dist):''}</span>`);
  for(const c of e.causes||[])t.push(`<span class="tag">${esc(c.toLowerCase())}${c===DRIVE()&&e.drive?' '+e.drive+' ч':''}</span>`);
  return t.join('');
}
function diary(){
  const q=ui.q.trim().toLowerCase();
  let list=[...E.values()].filter(hasContent).sort((a,b)=>b.date.localeCompare(a.date));
  if(q)list=list.filter(e=>[e.note,...(e.causes||[]),...(e.dayType||[]),...(e.sym||[]),...(e.workouts||[]).map(w=>w.t)].join(' ').toLowerCase().includes(q));
  let h=`<div class="topline"><div class="h1">Дневник</div><span class="pill num">${list.length} ${plural(list.length,'запись','записи','записей')}</span></div>
  <input type="search" id="search" placeholder="Поиск: простуда, руль, бассейн" aria-label="Поиск по дневнику" value="${esc(ui.q)}" style="margin-bottom:12px;background:var(--card)"><div class="stack">`;
  if(!list.length)h+=`<div class="card empty">${q?'Ничего не нашлось.':'Записей пока нет. Начни с вкладки «Сегодня» или загрузи старые записи в разделе «Ещё».'}</div>`;
  let cm='';
  for(const e of list.slice(0,ui.limit||60)){const d=pd(e.date),key=e.date.slice(0,7);if(key!==cm){cm=key;h+=`<div class="month">${MONN[d.getMonth()]} ${d.getFullYear()}</div>`}
    h+=`<button class="card entry" data-open="${e.date}"><div class="eh"><b class="num">День ${dayN(e.date)}</b><span>${d.getDate()} ${MON[d.getMonth()]}, ${WDS[d.getDay()]}</span></div>${e.note?`<p>${esc(e.note)}</p>`:''}<div class="tags">${tagsFor(e)}</div></button>`}

/* ---------- charts ---------- */
const PERIODS=[['day','День'],['week','Нед.'],['month','Мес.'],['q','3 мес'],['year','Год'],['all','Всё']];
const PDAYS={week:7,month:30,q:91,year:365};
function xTicks(x0,x1){const days=(x1-x0)/DAY,r=[];
  if(days>45){const d=new Date(x0);d.setDate(1);d.setMonth(d.getMonth()+1);while(d.getTime()<=x1){r.push({x:d.getTime(),t:MONN[d.getMonth()].slice(0,3).toLowerCase()});d.setMonth(d.getMonth()+1)}return r}
  const step=days>10?7:1;for(let t=x0;t<=x1+1;t+=step*DAY){const d=new Date(t);r.push({x:t,t:days>10?`${d.getDate()}.${String(d.getMonth()+1).padStart(2,'0')}`:WDS[d.getDay()]})}return r}
function niceRange(vals,step,pad=0){const lo=Math.floor((Math.min(...vals)-pad)/step)*step,hi=Math.ceil((Math.max(...vals)+pad)/step)*step||step;const t=[];for(let v=lo;v<=hi+1e-9;v+=step)t.push(+v.toFixed(2));return{yMin:lo,yMax:hi===lo?lo+step:hi,ticks:t}}
function chart({series,x0,x1,yMin,yMax,ticks,fmt,bands=[],marks=[],w=360,h=160}){
  const L=32,R=8,T=10,B=22,W=w-L-R,H=h-T-B,X=x=>L+(x1===x0?W/2:(x-x0)/(x1-x0)*W),Y=y=>T+H-(y-yMin)/(yMax-yMin)*H;
  let s=`<svg class="chart" viewBox="0 0 ${w} ${h}" role="img">`;
  const bw=Math.max(2,W/Math.max(1,(x1-x0)/DAY+1));
  for(const b of bands)s+=`<rect x="${X(b.x)-bw/2}" y="${T}" width="${bw}" height="${H}" fill="var(--bad)" fill-opacity=".12"/>`;
  for(const t of ticks)s+=`<line x1="${L}" x2="${w-R}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)"/><text x="${L-5}" y="${Y(t)+3}" text-anchor="end">${fmt(t)}</text>`;
  for(const xl of xTicks(x0,x1))s+=`<text x="${X(xl.x)}" y="${h-6}" text-anchor="middle">${xl.t}</text>`;
  for(const m of marks)s+=`<rect x="${X(m.x)-Math.min(bw*.35,4)}" y="${T+H-7}" width="${Math.min(bw*.7,8)}" height="7" rx="2" fill="var(--sleep)" fill-opacity=".85"/>`;
  for(const se of series){const p=se.pts;if(!p.length)continue;
    const d=p.map((q,i)=>`${i?'L':'M'}${X(q.x).toFixed(1)},${Y(q.y).toFixed(1)}`).join('');
    if(se.area&&p.length>1)s+=`<path d="${d}L${X(p.at(-1).x)},${T+H}L${X(p[0].x)},${T+H}Z" fill="${se.color}" fill-opacity=".14"/>`;
    if(p.length>1)s+=`<path d="${d}" fill="none" stroke="${se.color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" ${se.dash?`stroke-dasharray="${se.dash}"`:''}/>`;
    if(se.dots||p.length<3)for(const q of p)s+=`<circle cx="${X(q.x)}" cy="${Y(q.y)}" r="2.3" fill="${se.color}"/>`;
    const e=p.at(-1);s+=`<circle cx="${X(e.x)}" cy="${Y(e.y)}" r="4.5" fill="${se.color}" stroke="var(--card)" stroke-width="2"/>`}
  return s+'</svg>';
}
function periodEntries(){
  const end=todayISO();const all=[...E.values()].filter(hasContent).sort((a,b)=>a.date.localeCompare(b.date));
  if(ui.period==='all'||!all.length)return{list:all,from:all[0]?.date||end,end};
  const from=addDays(end,-(PDAYS[ui.period]-1));return{list:all.filter(e=>e.date>=from),from,end};
}
function dayView(){
  const d=ui.date,e=norm(entry(d)),h=e.health,from=addDays(d,-30);
  const mon=[...E.values()].filter(x=>x.date>=from&&x.date<d);
  const mean=f=>avg(mon.map(f).filter(v=>v!=null));
  const rows=[['Сон',h.sl,mean(x=>x.health?.sl),v=>fmtHM(v),'up'],['Шаги',h.steps,mean(x=>x.health?.steps),nf,'up'],['Вес',h.w,mean(x=>x.health?.w),v=>dec(v.toFixed(1))+' кг','down'],['Пульс покоя',h.rhr,mean(x=>x.health?.rhr),v=>Math.round(v),'down'],['Слабость рук',e.arms,mean(x=>x.arms),v=>dec(+v.toFixed(1)),'down'],['Слабость ног',e.legs,mean(x=>x.legs),v=>dec(+v.toFixed(1)),'down']].filter(r=>r[1]!=null||r[2]!=null);
  const dt=pd(d);
  return `<section class="card"><div class="ch">${h2('День против месяца')}<span class="aside">${dt.getDate()} ${MON[dt.getMonth()]}</span></div>
   ${rows.length?rows.map(([t,v,m,f,better])=>{const diff=v!=null&&m!=null?v-m:null;const good=diff==null?null:(better==='up'?diff>0:diff<0);
   return `<div class="row"><div><div class="t">${t}</div><div class="s num">среднее за 30 дней ${m!=null?f(m):'—'}</div></div><div style="text-align:right"><div class="num" style="font-weight:700;font-size:17px">${v!=null?f(v):'—'}</div>${diff!=null&&Math.abs(diff)>1e-6?`<div class="s num" style="color:${good?'var(--a1)':'var(--bad)'}">${diff>0?'▲':'▼'} ${f(Math.abs(diff))}</div>`:''}</div></div>`}).join(''):'<div class="sub">За этот день пока нет данных.</div>'}
   <div class="sub" style="margin-top:8px">День выбирается на вкладке «Сегодня» стрелками.</div></section>`;
}
function charts(){
  const head=`<div class="h1">Графики</div><div class="seg" style="margin:-4px 0 4px">${PERIODS.map(([k,l])=>`<button data-period="${k}" aria-pressed="${ui.period===k}">${l}</button>`).join('')}</div>`;
  if(ui.period==='day')return head+dayView();

  {const tp=list.map(e=>{const wi=wtInfo(e.date);return wi?.dev!=null?{x:pd(e.date).getTime(),y:+wi.dev.toFixed(2)}:null}).filter(Boolean);

/* ---------- links (correlations) ---------- */
function links(){
  const scored=[...E.values()].filter(e=>e.arms!=null||e.legs!=null).sort((a,b)=>a.date.localeCompare(b.date));
  const head=`<div class="h1">Связи</div>`;
  const NEED=10;
  if(scored.length<NEED)return head+`<div class="card empty"><div class="big" style="margin-bottom:8px">Нужно ещё ${NEED-scored.length} ${plural(NEED-scored.length,'день','дня','дней')} с оценкой слабости</div>
    <div class="bars"><div class="bar"><span>собрано</span><div class="track"><div class="fill" style="width:${scored.length/NEED*100}%"></div></div><b class="num">${scored.length}</b></div></div>
    <p class="sub" style="margin-top:10px">Когда дней хватит, приложение покажет, после чего слабость в руках и ногах бывает сильнее: руль, гиря, недосып, простуда, стресс и твои причины.</p></div>`;
  const at=d=>E.get(d);
  const val=(e,k)=>e?.[k];
  const cards=[];
  const bar=(l,v,c)=>`<div class="bar"><span>${l}</span><div class="track"><div class="fill ${c?'c':''}" style="width:${Math.min(v,10)*10}%"></div></div><b class="num">${dec(v.toFixed(1))}</b></div>`;
  function lagStats(test,k){const r=[];for(const lag of[0,1,2]){const yes=[],no=[];for(const e of E.values()){const t=at(addDays(e.date,lag));const v=val(t,k);if(v==null)continue;(test(e)?yes:no).push(v)}r.push({lag,yes:avg(yes),ny:yes.length,no:avg(no),nn:no.length})}return r}
  const causes=[...new Set([...E.values()].flatMap(causesOf))].filter(c=>c!=='Не знаю');
  for(const c of causes){for(const[k,limb]of[['arms','рук'],['legs','ног']]){
    const st=lagStats(e=>causesOf(e).includes(c),k);const best=st.filter(s=>s.ny>=3&&s.nn>=3).sort((a,b)=>(b.yes-b.no)-(a.yes-a.no))[0];
    if(!best||best.yes-best.no<0.7)continue;
    const when=['в тот же день','на следующий день','через 2 дня'][best.lag];
    cards.push({score:best.yes-best.no,html:`<section class="card ins"><div class="lbl" style="margin-bottom:6px">${esc(c)}</div><div class="big">После «${esc(c.toLowerCase())}» слабость ${limb} ${when} выше</div>
     <div class="bars">${st.map(s=>s.yes!=null?bar(['в тот же день','через 1 день','через 2 дня'][s.lag],s.yes):'').join('')}${bar('в остальные дни',best.no,1)}</div><div class="sub" style="margin-top:8px">Дней с этой причиной: ${best.ny}</div></section>`})}}
  {const yes=[],no=[];for(const e of E.values()){if(e.arms==null||e.health?.sl==null)continue;(e.health.sl<6?yes:e.health.sl>=7?no:[]).push(e.arms)}
   if(yes.length>=3&&no.length>=3&&avg(yes)-avg(no)>=0.5)cards.push({score:avg(yes)-avg(no),html:`<section class="card ins"><div class="lbl" style="margin-bottom:6px">Сон</div><div class="big">После ночи короче 6 часов слабость рук выше</div><div class="bars">${bar('сон < 6 ч',avg(yes))}${bar('сон 7+ ч',avg(no),1)}</div></section>`})}
  {const yes=[],no=[];for(const e of E.values()){if(e.arms==null)continue;(e.sick?yes:no).push(e.arms)}
   if(yes.length>=2&&no.length>=3&&avg(yes)-avg(no)>=0.5)cards.push({score:avg(yes)-avg(no),html:`<section class="card ins"><div class="lbl" style="margin-bottom:6px">Болезнь</div><div class="big">Во время болезни слабость рук выше</div><div class="bars">${bar('болел',avg(yes))}${bar('здоров',avg(no),1)}</div></section>`})}
  cards.sort((a,b)=>b.score-a.score);
  return head+`<p class="sub" style="margin:-6px 0 12px">Посчитано по ${scored.length} ${plural(scored.length,'дню','дням','дням')} с оценкой. Совпадение не всегда значит причину: это повод присмотреться и обсудить с врачом.</p><div class="stack">${cards.length?cards.map(c=>c.html).join(''):'<div class="card empty">Явных связей пока не видно. Чем больше дней с оценками и отмеченными причинами, тем точнее.</div>'}</div>`;
}

async function renameItem(key,i,nv){nv=(nv||'').trim();

async function start(){
  $('tabs').innerHTML=TABS.map(([k,l])=>`<button class="tab" role="tab" data-tab="${k}"><svg viewBox="0 0 24 24">${ICONS[k]}</svg>${l}</button>`).join('');
  try{await DB.open();const s=await DB.get('settings');if(s)S={...structuredClone(DEFAULTS),...s,goals:{...DEFAULTS.goals,...(s.goals||{})},sober:{...DEFAULTS.sober,...(s.sober||{})}};for(const e of await DB.all())E.set(e.date,norm(e))}
  catch(err){$('screen').innerHTML=`<div class="card empty">Хранилище недоступно: ${esc(err.message)}. Открой приложение с экрана «Домой», не в режиме частного доступа.</div>`;return}
  S.start=DEFAULTS.start;S.sober={...DEFAULTS.sober};S.goals={...DEFAULTS.goals,...S.goals};
  if((S.migr||0)<1){if(!S.causes.includes('Бег')){const i=S.causes.indexOf('Долгая ходьба');S.causes.splice(i>=0?i+1:S.causes.length,0,'Бег')}S.migr=1;await saveSettings()}
  if((S.migr||0)<2){for(const m of S.meds){if(!m.time)m.time=/вечер/i.test(m.d||'')?'21:00':/обед|день/i.test(m.d||'')?'13:00':'08:00';if(m.dose==null)m.dose=(m.d||'').split('·')[0].trim();delete m.d}
    for(const e of E.values()){let ch=false;for(const k of Object.keys(e.meds||{})){if(e.meds[k]===true){const mm=S.meds.find(x=>x.id===k);e.meds[k]={st:'taken',dose:mm?.dose||'',plan:mm?.time||''};ch=true}else if(e.meds[k]===false){delete e.meds[k];ch=true}}if(ch)await DB.put(e)}
    S.migr=2;await saveSettings()}
  if((S.migr||0)<3){if(!S.causes.includes('Болезнь')){const i=S.causes.indexOf('Простуда');S.causes.splice(i>=0?i+1:S.causes.length,0,'Болезнь')}const pk=S.exercises.find(x=>x.id==='pushk');if(pk){pk.deleted=true;pk.active=false}S.migr=3;await saveSettings()}
  if((S.migr||0)<4){S.causes=S.causes.filter(c=>c!=='Стресс');if(!S.emoWhy)S.emoWhy=[...DEFAULTS.emoWhy];S.migr=4;await saveSettings()}
  if((S.migr||0)<5){for(const id of ['plank','hang','squat','kb_swing','kb_lift']){const x=S.exercises.find(y=>y.id===id);if(x)x.step=5}S.migr=5;await saveSettings()}
  applyAccent();
  if(S.pin)await lockScreen();
  urlImport();
  document.addEventListener('click',onClick);
  let sx=null,sy=null;
  document.addEventListener('touchstart',ev=>{const h=ev.target.closest('#hero');if(!h||ev.touches.length!==1){sx=null;return}sx=ev.touches[0].clientX;sy=ev.touches[0].clientY},{passive:true});
  document.addEventListener('touchend',ev=>{if(sx==null)return;const dx=ev.changedTouches[0].clientX-sx,dy=ev.changedTouches[0].clientY-sy;sx=null;if(Math.abs(dx)<60||Math.abs(dy)>Math.abs(dx))return;const nd=addDays(ui.date,dx>0?-1:1);if(nd<=todayISO()){ui.date=nd;render()}},{passive:true});
  document.addEventListener('input',onInput);
  document.addEventListener('paste',ev=>{if(ev.target.id!=='pasteIn')return;const v=(ev.clipboardData||window.clipboardData)?.getData('text')||'';if(!v)return;ev.preventDefault();ui.pasteBox=false;if(!applyParams(new URLSearchParams(v.slice(v.indexOf('?')+1).trim()),false))toast('Не нашёл данных в тексте');else clearClip();rr()});
  document.addEventListener('focusout',async ev=>{if(ev.target.id==='exIn')commitEx(ev.target);if(ev.target.id==='lIn'&&!commitL.busy)commitL(ev.target)});
  document.addEventListener('change',ev=>{if((ev.target.id==='importFile'||ev.target.id==='importFile2')&&ev.target.files[0])doImport(ev.target.files[0])});
  document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&(ev.target.id==='exIn'||ev.target.id==='lIn')){ev.preventDefault();ev.target.blur()}if(ev.key==='Enter'&&ev.target.id==='causeIn'){ev.preventDefault();document.querySelector('[data-causesave]')?.click()}if(ev.key==='Enter'&&ev.target.id==='lAddIn'){ev.preventDefault();document.querySelector('[data-ladd]')?.click()}if(ev.key==='Enter'&&ev.target.id==='dtIn'){ev.preventDefault();document.querySelector('[data-dtsave]')?.click()}if(ev.key==='Enter'&&ev.target.id==='emoIn'){ev.preventDefault();document.querySelector('[data-emosave]')?.click()}});
  setInterval(()=>{const hm=nowHM();if(ui.tab==='today'&&hm!==ui.lastHM&&!document.activeElement?.matches('input,textarea')){ui.lastHM=hm;rr()}},20000);
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{applyAccent();rr()});
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){const t=todayISO();if(ui.date>t)ui.date=t;if(ui.tab==='today'){rr();if(ui.awaitPaste)setTimeout(()=>toast('Нажми «Вставить данные»'),300)}}});
  navigator.storage?.persist?.();
  render();
  if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
}
start();

</script>
</body>
</html>
